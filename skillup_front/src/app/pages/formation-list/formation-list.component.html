<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">
      <i class="bi bi-book text-primary"></i> Formations
    </h2>
    <a routerLink="/formations/new" class="btn btn-primary">
      <i class="bi bi-plus-lg"></i> New Formation
    </a>
  </div>

  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary"></div>
  </div>

  <div *ngIf="!loading && formations.length === 0" class="alert alert-info">
    No formations yet. Click "New Formation" to add one.
  </div>

  <div *ngIf="!loading && formations.length > 0" class="card shadow-sm">
    <table class="table table-hover mb-0">
      <thead class="table-light">
        <tr>
          <th>Titre</th>
          <th>Catégorie</th>
          <th>Niveau</th>
          <th class="text-end">Prix</th>
          <th class="text-end" style="width: 260px;">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let f of formations">
          <td>
            <div class="fw-semibold">{{ f.titre }}</div>
            <small class="text-muted">{{ f.description }}</small>
          </td>
          <td>
            <span class="badge bg-secondary">{{ f.categorieNom }}</span>
          </td>
          <td>
            <span class="badge"
                  [class.bg-success]="f.niveau === 'DEBUTANT'"
                  [class.bg-warning]="f.niveau === 'INTERMEDIAIRE'"
                  [class.bg-danger]="f.niveau === 'AVANCE'">
              {{ f.niveau }}
            </span>
          </td>
          <td class="text-end fw-semibold">{{ f.prix }} DT</td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-secondary me-1"
                    (click)="downloadPdf(f.id!, f.titre)"
                    title="Download PDF">
              <i class="bi bi-file-earmark-pdf"></i>
            </button>
            <a [routerLink]="['/formations', f.id, 'edit']"
               class="btn btn-sm btn-outline-primary me-1"
               title="Edit">
              <i class="bi bi-pencil"></i>
            </a>
            <button class="btn btn-sm btn-outline-danger"
                    (click)="delete(f.id!)"
                    title="Delete">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
