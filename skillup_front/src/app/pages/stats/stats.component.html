<div class="container py-4">
  <h2 class="mb-4">
    <i class="bi bi-graph-up text-primary"></i> Statistics
  </h2>

  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary"></div>
  </div>

  <div *ngIf="!loading && stats">
    <div class="row g-3 mb-4">
      <div class="col-md-3">
        <div class="card shadow-sm h-100 border-primary border-top border-3">
          <div class="card-body">
            <div class="text-muted small">Total Formations</div>
            <div class="h3 mb-0 mt-2">{{ stats.totalFormations }}</div>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card shadow-sm h-100 border-success border-top border-3">
          <div class="card-body">
            <div class="text-muted small">Average Price</div>
            <div class="h3 mb-0 mt-2">{{ stats.averagePrix | number:'1.0-2' }} DT</div>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card shadow-sm h-100 border-info border-top border-3">
          <div class="card-body">
            <div class="text-muted small">Min Price</div>
            <div class="h3 mb-0 mt-2">{{ stats.minPrix }} DT</div>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card shadow-sm h-100 border-warning border-top border-3">
          <div class="card-body">
            <div class="text-muted small">Max Price</div>
            <div class="h3 mb-0 mt-2">{{ stats.maxPrix }} DT</div>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-md-6">
        <div class="card shadow-sm h-100">
          <div class="card-body">
            <h5 class="card-title mb-3">
              <i class="bi bi-tags text-primary"></i> By Catégorie
            </h5>
            <div *ngIf="categorieEntries().length === 0" class="text-muted">No data</div>
            <div *ngFor="let e of categorieEntries()" class="mb-3">
              <div class="d-flex justify-content-between mb-1">
                <span class="fw-semibold">{{ e.key }}</span>
                <span class="text-muted">{{ e.value }}</span>
              </div>
              <div class="progress" style="height: 8px;">
                <div class="progress-bar bg-primary"
                     [style.width.%]="(e.value / maxCategorie()) * 100"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="card shadow-sm h-100">
          <div class="card-body">
            <h5 class="card-title mb-3">
              <i class="bi bi-bar-chart text-primary"></i> By Niveau
            </h5>
            <div *ngIf="niveauEntries().length === 0" class="text-muted">No data</div>
            <div *ngFor="let e of niveauEntries()" class="mb-3">
              <div class="d-flex justify-content-between mb-1">
                <span class="fw-semibold">{{ e.key }}</span>
                <span class="text-muted">{{ e.value }}</span>
              </div>
              <div class="progress" style="height: 8px;">
                <div class="progress-bar bg-success"
                     [style.width.%]="(e.value / maxNiveau()) * 100"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
