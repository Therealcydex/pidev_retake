<div class="container py-4">
  <h2 class="mb-4">
    <i class="bi bi-tags text-primary"></i> Catégories
  </h2>

  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <label class="form-label fw-semibold">Add new categorie</label>
      <form (ngSubmit)="add()" class="d-flex gap-2">
        <input type="text" class="form-control" placeholder="Nom" [(ngModel)]="newNom" name="newNom" required>
        <button type="submit" class="btn btn-primary" [disabled]="!newNom.trim()">
          <i class="bi bi-plus-lg"></i> Add
        </button>
      </form>
    </div>
  </div>

  <div *ngIf="categories.length === 0" class="alert alert-info">
    No categories yet.
  </div>

  <div *ngIf="categories.length > 0" class="card shadow-sm">
    <table class="table table-hover mb-0">
      <thead class="table-light">
        <tr>
          <th style="width: 80px;">ID</th>
          <th>Nom</th>
          <th class="text-end" style="width: 200px;">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of categories">
          <td class="text-muted">{{ c.id }}</td>

          <td>
            <ng-container *ngIf="editingId === c.id; else displayName">
              <input type="text" class="form-control form-control-sm" [(ngModel)]="editingNom">
            </ng-container>
            <ng-template #displayName>{{ c.nom }}</ng-template>
          </td>

          <td class="text-end">
            <ng-container *ngIf="editingId === c.id; else displayActions">
              <button class="btn btn-sm btn-success me-1" (click)="saveEdit()"
                      [disabled]="!editingNom.trim()">
                <i class="bi bi-check-lg"></i>
              </button>
              <button class="btn btn-sm btn-outline-secondary" (click)="cancelEdit()">
                <i class="bi bi-x-lg"></i>
              </button>
            </ng-container>
            <ng-template #displayActions>
              <button class="btn btn-sm btn-outline-primary me-1" (click)="startEdit(c)">
                <i class="bi bi-pencil"></i>
              </button>
              <button class="btn btn-sm btn-outline-danger" (click)="delete(c.id!)">
                <i class="bi bi-trash"></i>
              </button>
            </ng-template>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
