# PIDEV Retake — SkillUp (Formation + User modules)
#
# Prereqs:
#   - XAMPP MySQL running on host port 3306 (root, no password)
#
# Usage:
#   docker compose up -d           → build images and start all containers
#   docker compose ps              → verify all containers are Up
#   docker compose logs -f <svc>   → tail logs for a service
#   docker compose down            → stop everything (keeps grafana_data)
#   docker compose down -v         → stop everything and wipe volumes

networks:
  elevate-net:
    driver: bridge

volumes:
  grafana_data:

# host.docker.internal → resolves to the Windows host from inside containers,
# so Spring services can reach XAMPP MySQL running on the host at :3306.
# The extra_hosts line under each service makes this portable to Linux too.

services:

  # ─── Spring Cloud infrastructure ────────────────────────────────────────────

  eureka:
    build: ./backEnd/eureka
    container_name: eureka
    restart: on-failure
    ports:
      - "8761:8761"
    networks: [elevate-net]
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  config-server:
    build: ./backEnd/config-server
    container_name: config-server
    restart: on-failure
    ports:
      - "8888:8888"
    networks: [elevate-net]
    depends_on:
      eureka:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  gateway:
    build: ./backEnd/gateway
    container_name: gateway
    restart: on-failure
    ports:
      - "9090:9090"
    networks: [elevate-net]
    depends_on:
      eureka:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka
      - CONFIG_SERVER_URL=http://config-server:8888

  # ─── Business microservices (talk to XAMPP MySQL on the host) ───────────────

  user:
    build: ./backEnd/microservices/user
    container_name: user
    restart: on-failure
    ports:
      - "8024:8024"
    networks: [elevate-net]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      eureka:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka
      - CONFIG_SERVER_URL=http://config-server:8888
      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3306/db_elevate_user?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=
      - JWT_SECRET=c2tpbGx1cC1qd3Qtc2VjcmV0LWtleS0yMDI0LWVzcHJpdC1hcHBsaWNhdGlvbg==

  formation:
    build: ./backEnd/microservices/Formation
    container_name: formation
    restart: on-failure
    ports:
      - "8084:8084"
    networks: [elevate-net]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      eureka:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka
      - CONFIG_SERVER_URL=http://config-server:8888
      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3306/db_elevate_formation?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=

  # ─── Monitoring ─────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [elevate-net]
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks: [elevate-net]
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # ─── Keycloak (IAM) ─────────────────────────────────────────────────────────

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.1
    container_name: keycloak
    restart: always
    command: start-dev --http-port=8099
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HOSTNAME_STRICT=false
    ports:
      - "8099:8099"
    networks: [elevate-net]
    volumes:
      - ./data/keycloak:/opt/keycloak/data
