# Shadows src/main/resources/application.properties during tests: Maven puts
# target/test-classes ahead of target/classes, so this file is the one that is found.
#
# The point is that it does NOT declare spring.config.import=configserver:... — the
# import is resolved during bootstrap, before any property could switch it off, so the
# only reliable way to skip it is to not declare it at all. That is what lets the tests
# run with no config-server and no Eureka.

spring.application.name=user
spring.cloud.config.enabled=false

# No service discovery in tests.
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
