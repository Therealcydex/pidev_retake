spring.application.name=user
server.port=8024

# Config server disabled — standalone run
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# Datasource — defaults to XAMPP on localhost; overridden by SPRING_DATASOURCE_URL env var in Docker
spring.datasource.url=jdbc:mysql://localhost:3306/pidev_user?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Eureka — env var overrides for Docker
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# JWT secret — env var override for Docker
jwt.secret=${JWT_SECRET:c2tpbGx1cC1qd3Qtc2VjcmV0LWtleS0yMDI0LWVzcHJpdC1hcHBsaWNhdGlvbg==}

# Actuator / Monitoring
management.endpoints.web.exposure.include=health,info,prometheus,metrics,refresh
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

server.forward-headers-strategy=framework
springdoc.api-docs.path=/users/v3/api-docs
