spring.application.name=Formation
server.port=8084

# Config server disabled — standalone run
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# Datasource — defaults to XAMPP on localhost; overridden by SPRING_DATASOURCE_URL env var in Docker
spring.datasource.url=jdbc:mysql://localhost:3306/pidev_formation?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Eureka — env var overrides for Docker
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Actuator / Monitoring
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
