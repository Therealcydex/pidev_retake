# Shadows src/main/resources/application.properties during tests: Maven puts
# target/test-classes ahead of target/classes, so this file is the one that is found.
#
# The point is that it does NOT declare spring.config.import=configserver:... — the
# import is resolved during bootstrap, before any profile-specific file could switch it
# off, so the only reliable way to skip it is to not declare it at all. That is what
# lets `mvn verify` run with no config-server, no MySQL, no Eureka and no USER service.

spring.application.name=Formation
spring.cloud.config.enabled=false

# In-memory database, thrown away after the run. MySQL mode so the MySQL-specific
# column definitions in the entities (TEXT, MEDIUMBLOB) are understood.
spring.datasource.url=jdbc:h2:mem:formation;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# No service discovery in tests; the USER client is replaced by a Mockito mock.
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
