
server.port=8024

# Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/pidev_user?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# JWT — fixed key, must not change between restarts
jwt.secret=c2tpbGx1cC1qd3Qtc2VjcmV0LWtleS0yMDI0LWVzcHJpdC1hcHBsaWNhdGlvbg==

# Mail — reinitialisation de mot de passe (Gmail SMTP)
# Le mot de passe d'application n'est PAS ecrit ici : il vient de l'environnement.
# Definir MAIL_USERNAME et MAIL_PASSWORD avant de demarrer le service.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Sans ces delais, un port SMTP bloque fait attendre la requete indefiniment.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Tache planifiee — menage des codes de reinitialisation perimes
# Pour une demonstration, descendre l'intervalle a 10000 (10 s) et passer verbose a true.
skillup.cleanup.interval-ms=3600000
skillup.cleanup.initial-delay-ms=60000
skillup.cleanup.verbose=false

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics,refresh
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

server.forward-headers-strategy=framework
springdoc.api-docs.path=/users/v3/api-docs
