server.port=8024

spring.datasource.url=jdbc:mysql://localhost:3306/db_elevate_user?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

management.endpoints.web.exposure.include=health,info,prometheus,metrics,refresh
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}









logging.level.org.springframework.security=DEBUG



spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect





# Logging pour le debogage
logging.level.org.springdoc=DEBUG



server.forward-headers-strategy=framework
springdoc.api-docs.path=/users/v3/api-docs

