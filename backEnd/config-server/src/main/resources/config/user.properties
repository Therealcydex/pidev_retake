
server.port=8024

# Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/pidev_user?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# JWT — fixed key, must not change between restarts
jwt.secret=c2tpbGx1cC1qd3Qtc2VjcmV0LWtleS0yMDI0LWVzcHJpdC1hcHBsaWNhdGlvbg==

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics,refresh
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

server.forward-headers-strategy=framework
springdoc.api-docs.path=/users/v3/api-docs
