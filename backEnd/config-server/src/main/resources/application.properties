spring.application.name=config-server
server.port=8888

# Eureka registration.
# This server starts FIRST (config-first: eureka and gateway are its clients), so Eureka
# is not up yet at boot. The Eureka client retries in the background and registers once
# it appears - the connection-refused warnings during the first seconds are expected.
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true

# Load config files locally
spring.profiles.active=native
spring.cloud.config.server.native.searchLocations=classpath:/config
